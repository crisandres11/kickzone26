<link rel="icon" type="image/png" href="../assets/KZ2026_favicon.png">
<link rel="shortcut icon" href="../assets/KZ2026_favicon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: wordmark bar, LED-style scoreboard strip, pitch stage. Menu, fixtures and tables replace the stage between matches.
   Single look on purpose: a night-match scoreboard in amber over a turf pitch. */
:root{
  color-scheme:dark;
  --ink:#0c131f;
  --panel:#152033;
  --panel-2:#1c2a42;
  --line:#2a3b57;
  --chalk:#f0ede3;
  --mute:#8fa0ba;
  --amber:#ffb627;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow Semi Condensed','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{
  background:var(--ink);color:var(--chalk);
  font:16px/1.45 var(--body);
  padding-block:12px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:920px;margin:0 auto;display:grid;gap:12px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font:900 36px/1 var(--display);letter-spacing:.03em;display:flex;align-items:baseline;gap:8px}
.mark b{color:var(--amber);font-weight:900}
.mark small{font:600 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tools{display:flex;gap:8px}
.tools button{
  font:700 14px var(--display);letter-spacing:.08em;text-transform:uppercase;
  background:var(--panel);color:var(--chalk);border:1px solid var(--line);
  padding:8px 12px;min-height:40px;cursor:pointer;
}
button:focus-visible,input:focus-visible+span,summary:focus-visible,.seg input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}

#hud{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--line);padding:10px 14px;
}
.tm{font:800 clamp(15px,3.6vw,22px)/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px;min-width:0}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm.r{justify-content:flex-end}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;overflow:hidden;position:relative}
.dot.fl,.shirt.fl{background:none!important;box-shadow:none!important;border-radius:0;width:auto;height:auto;overflow:visible}
.dot.fl img,.shirt.fl img{position:static;display:block;height:16px;width:auto;max-width:34px;object-fit:contain;border-radius:2px}
.vs .dot.fl img{height:26px;max-width:44px}
.shirt.fl img{height:44px;max-width:64px}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.score{
  font:900 clamp(34px,8vw,52px)/1 var(--display);color:var(--amber);
  background:#070b12;border:1px solid #000;padding:4px 14px;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,182,39,.35);
}
.clk{font:700 14px/1 var(--display);letter-spacing:.18em;color:var(--mute);font-variant-numeric:tabular-nums}

.stage{position:relative;border:1px solid var(--line);background:#0a1018}
canvas{display:block;width:100%;aspect-ratio:880/520;touch-action:none}
.pause{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:rgba(7,11,18,.82)}
.pause h2{margin:0;font:900 56px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}

.card{background:var(--panel);border:1px solid var(--line);padding:clamp(16px,4vw,32px);display:grid;gap:18px;min-width:0}
.kicker{margin:0;font:600 13px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.card h1{margin:0;font:900 clamp(30px,7vw,52px)/1 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.card h2{margin:0;font:800 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.card p{margin:0;color:var(--mute);max-width:62ch}
.lbl,legend{font:600 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px}
input[type=text]{
  font:600 20px var(--body);background:var(--ink);color:var(--chalk);border:1px solid var(--line);
  padding:10px 12px;width:100%;max-width:360px;min-height:46px;
}
.row{display:flex;flex-wrap:wrap;gap:10px}
.sw{position:relative;cursor:pointer}
.sw input,.seg input{position:absolute;opacity:0;inset:0;margin:0}
.sw span{display:block;width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 3px var(--panel)}
.sw input:checked+span{border-color:var(--chalk)}
.seg{position:relative;cursor:pointer}
.seg span{display:block;padding:11px 18px;border:1px solid var(--line);background:var(--ink);font:700 16px var(--display);letter-spacing:.08em;text-transform:uppercase;min-height:44px}
.seg input:checked+span{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.btn{
  font:800 18px var(--display);letter-spacing:.08em;text-transform:uppercase;
  padding:12px 22px;border:1px solid var(--line);background:var(--panel-2);color:var(--chalk);cursor:pointer;min-height:48px;
}
.btn.primary{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.btn:hover{filter:brightness(1.1)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 18px;color:var(--mute);font-size:15px}
.keys div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
kbd{font:600 13px var(--body);background:var(--ink);border:1px solid var(--line);padding:2px 7px;color:var(--chalk)}
details summary{cursor:pointer;font:600 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:6px 0}
details[open] summary{margin-bottom:10px}

.vs{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font:900 clamp(24px,6vw,44px)/1.1 var(--display);text-transform:uppercase}
.vs em{font-style:normal;color:var(--mute);font-size:.6em;letter-spacing:.12em}
.vs .dot{width:22px;height:22px}
.fx{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.fx li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;background:var(--ink);border:1px solid var(--line);font-size:15px}
.fx li.now{border-color:var(--amber)}
.fx b{font-variant-numeric:tabular-nums}
.res-w{color:#6fe39a}.res-l{color:#ff7a7a}.res-d{color:var(--mute)}
.big{font:900 clamp(60px,16vw,110px)/1 var(--display);color:var(--amber);letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(255,182,39,.3)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:440px}
.tbl th{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:16px}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl th:first-child,.tbl td:first-child{text-align:left;width:34px;color:var(--mute)}
.tbl td:nth-child(2){font-weight:600;display:flex;gap:10px;align-items:center}
.tbl td:last-child{font:900 20px var(--display);color:var(--amber)}
.tbl tr.me{background:rgba(255,182,39,.12)}
.ck{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:0}
.ck div{border:1px solid var(--line);background:var(--panel-2);padding:10px 12px}
.ck dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8fa0ba}
.ck dd{margin:4px 0 0;font:800 24px/1 var(--display)}
.ofl{display:grid;gap:10px}
.ofl .btn{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.ofl small{color:#8fa0ba}
.banner{font:900 clamp(26px,6vw,40px)/1.1 var(--display);text-transform:uppercase;color:var(--amber)}

#pad{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 4px;touch-action:none;user-select:none;-webkit-user-select:none}
#joy{position:relative;width:132px;height:132px;border-radius:50%;border:2px solid var(--line);background:var(--panel);touch-action:none}
#knob{position:absolute;left:39px;top:39px;width:54px;height:54px;border-radius:50%;background:var(--amber);opacity:.85}
.pb{display:flex;gap:12px}
.pb button{width:84px;height:84px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--chalk);font:800 15px var(--display);letter-spacing:.08em;touch-action:none;user-select:none;-webkit-user-select:none}
.pb button.on{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.hint{font-size:14px;color:var(--mute);text-align:center;margin:0}

a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
p a{color:var(--amber)}
.dev{display:grid;gap:20px;justify-items:center;text-align:center;padding:clamp(28px,7vw,64px) 16px;background:var(--panel);border:1px solid var(--line)}
.dev h1{margin:0;font:900 clamp(34px,8vw,64px)/1 var(--display);text-transform:uppercase;text-wrap:balance}
.dev p{margin:0}
.dev .sub{color:var(--mute);max-width:46ch}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.opt{width:min(240px,42vw);min-width:150px;display:grid;justify-items:center;gap:10px;padding:22px 14px;background:var(--ink);border:2px solid var(--line);color:var(--chalk);cursor:pointer;font:800 clamp(20px,4.6vw,28px) var(--display);letter-spacing:.08em;text-transform:uppercase}
.opt:hover,.opt:focus-visible{border-color:var(--amber)}
.opt.on{border-color:var(--amber);background:rgba(255,182,39,.12)}
.opt svg{width:64px;height:64px;stroke:var(--amber);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* ----- inicio ----- */
.app.is-home .mark{visibility:hidden}
.home{position:relative;overflow:hidden;border:1px solid var(--line);background:#08101c;min-height:clamp(460px,74vh,700px);display:grid;place-items:center;isolation:isolate}
.home canvas{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;z-index:0}
.home::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(8,16,28,.05) 0%,rgba(8,16,28,.55) 60%,rgba(8,16,28,.88) 100%)}
.hc{position:relative;z-index:2;display:grid;justify-items:center;gap:clamp(10px,2.4vh,20px);text-align:center;padding:28px 16px}
.hk{margin:0;font:600 clamp(11px,2.8vw,14px)/1 var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--amber);animation:rise .8s .9s both}
.ht{margin:0;display:flex;align-items:flex-end;gap:clamp(10px,3vw,28px);font:900 clamp(96px,27vw,250px)/.82 var(--display);letter-spacing:.01em;text-transform:uppercase}
.ht span{display:flex}
.ht i{font-style:normal;display:block;animation:drop .9s calc(var(--d) * .13s + .1s) cubic-bezier(.2,1.4,.4,1) both}
.tk{background:linear-gradient(105deg,#f0ede3 38%,#ffffff 50%,#f0ede3 62%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4.2s 1.6s linear infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45))}
.tn{color:var(--amber);text-shadow:0 0 28px rgba(255,182,39,.45),0 6px 0 rgba(0,0,0,.45);animation:glow 3s 1.6s ease-in-out infinite}
.hs{margin:0;font:500 clamp(16px,3.6vw,22px)/1.3 var(--body);color:#c9d3e4;max-width:34ch;animation:rise .8s 1.2s both}
.hb{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:6px;animation:rise .8s 1.45s both}
.hb .btn{font-size:clamp(20px,4.6vw,26px);padding:14px clamp(26px,7vw,52px);min-height:56px}
.hb .btn.primary{animation:pulse 2.2s 2.4s ease-in-out infinite}
.hm{margin:0;font-size:14px;color:var(--mute);animation:rise .8s 1.7s both}
@keyframes drop{from{transform:translateY(-70px) scale(1.18);opacity:.2}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:.15}to{transform:none;opacity:1}}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes glow{0%,100%{text-shadow:0 0 18px rgba(255,182,39,.3),0 6px 0 rgba(0,0,0,.45)}50%{text-shadow:0 0 44px rgba(255,182,39,.75),0 6px 0 rgba(0,0,0,.45)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,182,39,.5)}50%{box-shadow:0 0 0 12px rgba(255,182,39,0)}}
@media (prefers-reduced-motion:reduce){.home *{animation:none!important}}

/* ----- plantilla ----- */
.squad{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.squad svg{width:100%;height:auto;display:block;border:1px solid var(--line)}
.pcs{display:grid;gap:10px;min-width:0}
.pc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center;background:var(--ink);border:1px solid var(--line);padding:10px 12px}
.pc .num{grid-row:span 3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:900 22px var(--display);border:3px solid #fff}
.pc .pos{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.pc input[type=text]{font-size:18px;min-height:40px;padding:6px 10px;max-width:none}
.pc .ds{font-size:14px;color:var(--mute)}
@media (max-width:720px){.squad{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){
  .mark small{display:none}
  #hud{padding:8px 10px;gap:8px}
}
@media (max-width:480px){.pb{gap:8px}.pb button{width:64px;height:64px;font-size:13px}}
.top{flex-wrap:wrap}
.tools{flex-wrap:wrap;justify-content:flex-end}
.idchip{display:inline-flex;align-items:center;min-height:40px;padding:8px 12px;border:1px solid var(--line);background:var(--panel);color:var(--amber);font:700 14px var(--display);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;font-variant-numeric:tabular-nums}
.idchip:hover,.idchip:focus-visible{border-color:var(--amber)}
/* ----- equipos y mejoras de interfaz ----- */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.tcard{position:relative;display:block;cursor:pointer;min-width:0}
.tcard input{position:absolute;opacity:0;inset:0;margin:0}
.tc{display:grid;gap:6px;align-content:start;height:100%;padding:14px;background:var(--ink);border:2px solid var(--line);min-width:0}
.tcard:hover .tc{border-color:var(--mute)}
.tcard input:checked+.tc{border-color:var(--amber);background:rgba(255,182,39,.08)}
.tcard input:focus-visible+.tc{outline:2px solid var(--amber);outline-offset:2px}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.shirt{position:relative;overflow:hidden;display:block;width:40px;height:40px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 4px var(--c2);margin:4px}
.tc-r{display:grid;justify-items:end;gap:2px}
.tc-r b{font:900 32px/1 var(--display);font-variant-numeric:tabular-nums}
.tc-r small{font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tc strong{font:800 22px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.tc-k{color:var(--mute);font-size:13px}
.tcard input:checked+.tc .tc-k::after{content:" · Tu equipo";color:var(--amber);font-weight:600}
.tc-p{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menurow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 32px}
#hud{box-shadow:inset 5px 0 0 var(--ca,#3a86ff),inset -5px 0 0 var(--cb,#e63946)}
.tbar{grid-column:1/-1;height:4px;background:var(--panel-2)}
.tbar i{display:block;height:100%;width:0;background:var(--amber)}
#keyHint kbd{font-size:12px}
.pause .hint{margin:0}
.fx .fxn{display:flex;align-items:center;gap:10px;min-width:0}
.goals{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.goals li{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--ink);border:1px solid var(--line)}
.goals .gm{font:800 18px var(--display);color:var(--amber);min-width:38px;font-variant-numeric:tabular-nums}
</style>

<div class="app">
  <div class="top">
    <div class="mark">KZ<b>26</b><small id="ctx">Jugar</small></div>
    <div class="tools">
      <a class="idchip" id="bId" href="../home/game/#perfil" title="Ver mi perfil">ID</a>
      <button id="bPause" type="button" hidden>Pausa</button>
      <button id="bMute" type="button" aria-pressed="false">Sonido: sí</button>
    </div>
  </div>

  <div id="hud" hidden>
    <div class="tm"><i class="dot" id="hDotA"></i><span id="hNameA"></span></div>
    <div class="mid">
      <div class="score"><span id="hA">0</span> - <span id="hB">0</span></div>
      <div class="clk" id="hClk">0'</div>
    </div>
    <div class="tm r"><span id="hNameB"></span><i class="dot" id="hDotB"></i></div>
    <div class="tbar" aria-hidden="true"><i id="hBar"></i></div>
  </div>

  <div class="stage" id="stage" hidden>
    <canvas id="cv" role="img" aria-label="Cancha de fútbol vista desde arriba"></canvas>
    <div class="pause" id="pauseBox" hidden>
      <h2>Pausa</h2>
      <p class="hint">En PC, pulsa Esc para seguir</p>
      <button class="btn primary" type="button" id="bResume">Reanudar</button>
      <button class="btn" type="button" id="bQuit">Salir al inicio</button>
    </div>
  </div>

  <div id="pad" hidden>
    <div id="joy" aria-label="Palanca de movimiento"><div id="knob"></div></div>
    <div class="pb">
      <button type="button" id="tRun">CORRER</button>
      <button type="button" id="tPass">PASE</button>
      <button type="button" id="tShoot">TIRO</button>
    </div>
  </div>
  <p class="hint" id="keyHint" hidden><kbd>←↑↓→</kbd> o <kbd>WASD</kbd> mover · <kbd>Espacio</kbd> pase · <kbd>P</kbd> tiro (mantén = potente) · <kbd>L</kbd> correr · <kbd>Esc</kbd> pausa</p>
  <p class="hint" id="padHint" hidden>Toca TIRO para tirar y mantenlo para un tiro potente. Mantén CORRER para correr.</p>

  <div id="screen"></div>
  <audio id="crowd" loop preload="auto" src="../assets/FootballCrowd.mp3"></audio>
  <audio id="bgm" loop preload="auto" src="../assets/jonasblakewood-background-music-618629.mp3"></audio>
</div>

<script>
(() => {
'use strict';

  { name: 'Difícil', speed: 152, gk: 180, shoot: .62, pass: .60, spread: .07 }
];
/* Equipos definidos a partir de la lista de jugadores (Jugadores - Hoja 1).
   Nombres, dorsales, valoraciones y selección/equipo salen de la lista; los colores de camiseta son de diseño. */
const TEAMS = [
  { id: 'elpuente', flag: '../assets/ElPuente.png', name: 'El Puente', kind: 'Selección', c1: '#3a86ff', c2: '#ffffff', roster: [

  { id: 'crispantolo', flag: '../assets/CrisPantolo.jpg', name: 'CrisPantolo', kind: 'Selección', c1: '#9b5de5', c2: '#f3e8ff', roster: [
    { n: 'CrisFut', d: 10, r: 93 }, { n: 'Tomás V.', d: 12, r: 86 } ] },

function doPass(m, p, dx, dy) {
  const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
  const q = pickMate(m, p, dx, dy);
  if (q) {
    const tx = q.x + q.vx * .35, ty = q.y + q.vy * .35;
    const vx = tx - p.x, vy = ty - p.y, d = Math.hypot(vx, vy);
    kick(m, p, vx, vy, clamp(d * 1.45 + 90, 200, 520), 'pass');
    m.passTarget = q;
  } else kick(m, p, dx, dy, 300, 'pass');
}
function doShoot(m, p, ch, spread) {
  const gx = p.team === 0 ? W : 0;
  const gk = m.players.find(q => q.team !== p.team && q.role === 'gk');
  const ty = H / 2 + (gk.y >= H / 2 ? -1 : 1) * GH * .28;
  const gdx = gx - p.x, gdy = ty - p.y, gl = Math.hypot(gdx, gdy) || 1;
  let ax = p.fx, ay = p.fy;
  const cos = (ax * gdx + ay * gdy) / gl;
  if (cos > .82) { ax = gdx / gl; ay = gdy / gl; }
  const ang = Math.atan2(ay, ax) + rnd(-1, 1) * (spread || 0);
  kick(m, p, Math.cos(ang), Math.sin(ang), 360 + ch * 300, 'kick');
  m.shotTeam = p.team; m.shotT = 2.6;
}

function accel(p, vx, vy, dt) {
  const k = Math.min(1, 11 * dt);
  p.vx += (vx - p.vx) * k; p.vy += (vy - p.vy) * k;
  p.x += p.vx * dt; p.y += p.vy * dt;
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > 25) {
    const t = Math.min(1, 14 * dt);
    p.fx += (p.vx / sp - p.fx) * t; p.fy += (p.vy / sp - p.fy) * t;
    const l = Math.hypot(p.fx, p.fy) || 1; p.fx /= l; p.fy /= l;
  }
  p.x = clamp(p.x, p.r, W - p.r); p.y = clamp(p.y, p.r, H - p.r);
}
function moveTo(p, tx, ty, spd, dt, soft) {
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
  let vx = 0, vy = 0;
  if (d > 4) { const s = soft ? spd * Math.min(1, d / 24) : spd; vx = dx / d * s; vy = dy / d * s; }
  accel(p, vx, vy, dt);
}

function humanMove(m, p, dt) {
  const l = Math.hypot(inp.mx, inp.my);
  const wantRun = inp.run && l > .1 && !inp.shootHeld && !m.tired;
  if (wantRun) { m.stam = Math.max(0, m.stam - 38 * dt); if (m.stam <= 0) m.tired = true; }
  else { m.stam = Math.min(100, m.stam + 20 * dt); if (m.tired && m.stam >= 25) m.tired = false; }
  const sp = SPEED_H * (1 + (m.boost || 0)) * (inp.shootHeld ? .72 : wantRun ? 1.55 : 1);
  let vx = 0, vy = 0;
  if (l > .1) { const k = Math.min(1, l) / l; vx = inp.mx * k * sp; vy = inp.my * k * sp; }
  accel(p, vx, vy, dt);
  const near = canKick(p, m.ball);
  if (inp.passQ) {
    inp.passQ = false;
    if (near) {
      let dx = inp.mx, dy = inp.my;
      if (Math.hypot(dx, dy) < .2) { dx = p.fx; dy = p.fy; }
      doPass(m, p, dx, dy);
    }
  }
  if (inp.shootHeld) m.charge = Math.min(1, m.charge + dt / .8);
  if (inp.shootRel) {
    inp.shootRel = false;
    if (near) doShoot(m, p, Math.max(.25, m.charge), 0);
    m.charge = 0;
  }
  if (!inp.shootHeld && m.charge > 0 && !inp.shootRel) m.charge = Math.max(0, m.charge - dt * 2);
}

function homePos(m, p) {
  const b = m.ball;
  const rel = p.team === 0 ? b.x / W : 1 - b.x / W;
  const poss = m.last && m.last.team === p.team;
  const shift = p.idx === 1 ? .18 : .34;
  const fx = clamp(p.bx + (rel - .5) * shift + (poss ? .07 : -.03), .1, .9);
  const fy = p.by + (b.y - H / 2) / H * .25;
  return [p.team === 0 ? fx * W : W - fx * W, clamp(fy * H, 40, H - 40)];
}

function aiBall(m, p, lvl) {
  if (p.think > 0) return;
  const dirx = p.team === 0 ? 1 : -1, gx = p.team === 0 ? W : 0;
  const dg = Math.hypot(gx - p.x, H / 2 - p.y);
  let dOpp = 1e9, opp = null;
  for (const q of m.players) {
    if (q.team === p.team || q.role !== 'f') continue;
    const d = dist(p, q); if (d < dOpp) { dOpp = d; opp = q; }
  }
  const r = Math.random();
  p.think = rnd(.18, .38);
  if (dg < 280 && Math.abs(p.y - H / 2) < 200 && r < lvl.shoot) {
    p.fx = (gx - p.x) / dg; p.fy = (H / 2 - p.y) / dg;
    doShoot(m, p, rnd(.55, 1), lvl.spread); p.think = .6; return;
  }
  if (opp && dOpp < 50 && Math.random() < lvl.pass) {
    doPass(m, p, dirx, (H / 2 - p.y) / 400); p.think = .5; return;
  }
  p.dribble = true;
}

function aiField(m, p, dt, lvl) {
  const b = m.ball, dirx = p.team === 0 ? 1 : -1, gx = p.team === 0 ? W : 0;
  const spd = p.team === 1 ? lvl.speed : SPEED_H * .92;
  p.dribble = false;
  const chaser = m.chaser[p.team] === p;
  const reach = canKick(p, b);
  if (reach && (chaser || p.team === 1 || dist(p, b) < p.r + BR + 4)) aiBall(m, p, lvl);
  if (m.owner === p) p.dribble = true;
  if (chaser || (p.dribble && reach)) {
    if (p.dribble && reach) {
      let ty = H / 2;
      for (const q of m.players) {
        if (q.team !== p.team && q.role === 'f' && (q.x - p.x) * dirx > 0 && (q.x - p.x) * dirx < 90 && Math.abs(q.y - p.y) < 40) {
          ty = p.y + (p.y < q.y ? -70 : 70);
        }
      }
      moveTo(p, gx - dirx * 20, clamp(ty, 40, H - 40), spd, dt, false);
    } else {
      const lead = clamp(dist(p, b) / 400, 0, .5);
      let tx = b.x + b.vx * lead, ty = b.y + b.vy * lead;
      if ((tx - p.x) * dirx < 8) {
        tx = b.x - dirx * 28;
        ty = b.y + (Math.abs(b.y - p.y) < 30 ? (p.y < b.y ? -30 : 30) : 0);
      }
      moveTo(p, tx, clamp(ty, 12, H - 12), spd, dt, false);
    }
  } else {
    const h = homePos(m, p);
    moveTo(p, h[0], h[1], spd * .85, dt, true);
  }
}

function aiGK(m, p, dt, lvl) {
  const b = m.ball, dirx = p.team === 0 ? 1 : -1, lineX = p.team === 0 ? 24 : W - 24;
  const spd = p.team === 1 ? lvl.gk : 150;
  const towards = (b.vx * -dirx) > 40;
  const dB = dist(p, b);
  let tx = lineX + dirx * (towards ? 14 : 0);
  let ty = clamp(b.y + b.vy * .12, H / 2 - GH / 2 + 14, H / 2 + GH / 2 - 14);
  const inZone = Math.abs(b.x - lineX) < 125 && Math.abs(b.y - H / 2) < 150;
  if (inZone && dB < 120 && (Math.hypot(b.vx, b.vy) < 130 || towards)) {
    tx = p.team === 0 ? clamp(b.x, 14, 130) : clamp(b.x, W - 130, W - 14);
    ty = clamp(b.y, H / 2 - 150, H / 2 + 150);
    if (canKick(p, b)) {
      kick(m, p, dirx, (H / 2 - p.y) / 220 + rnd(-.4, .4), 440, 'kick');
      p.cool = .5;
    }
  }
  moveTo(p, tx, ty, spd, dt, true);
}

function pickCtrl(m, dt) {
  m.ctrlT -= dt;
  if (m.ctrlT > 0 && m.ctrl) return;
  m.ctrlT = .12;
  let best = null, bd = 1e9;
  for (const p of m.players) {
    if (p.team !== 0 || p.role !== 'f') continue;
    const d = dist(p, m.ball) - (p === m.ctrl ? 18 : 0);
    if (d < bd) { bd = d; best = p; }
  }
  m.ctrl = best;
}
function pickChaser(m) {
  let best = null, bd = 1e9;
  for (const p of m.players) {
    if (p.team !== 1 || p.role !== 'f') continue;
    const d = dist(p, m.ball) - (p === m.chaser[1] ? 16 : 0);
    if (d < bd) { bd = d; best = p; }
  }
  m.chaser[1] = best; m.chaser[0] = m.ctrl;
}

/* un tiro que choca contra la línea de fondo fuera del arco = gol errado */
function missShot(m, team) {
  if (m.phase === 'play' && m.shotTeam === team && m.shotT > 0) { m.shotTeam = -1; sfx.nogoal(); }
}
function scoreGoal(m, team) {
  m.shotTeam = -1;
  m.score[team]++; m.goalBy = team; m.phase = 'goal'; m.phaseT = 2.4; m.owner = null;
  const sc = m.last;
  if (team === 0 && sc && sc.team === 0 && m.humanKick) m.myGoals = (m.myGoals || 0) + 1;
  m.scorer = !sc ? '' : sc.team === team ? sc.num + ' ' + sc.name : sc.name + ' (en contra)';
  m.goals.push({ team, min: clamp(Math.ceil(m.time / m.dur * 90), 1, 90), who: m.scorer || 'Gol' });
  inp.shootHeld = false; inp.shootRel = false; inp.passQ = false; m.charge = 0;
  sfx.goal();
}

function ballStep(m, dt) {
  const b = m.ball;
  const ow = m.owner;
  if (ow) {
    const gap = ow.r + BR + 1;
    b.x = ow.x + ow.fx * gap; b.y = ow.y + ow.fy * gap;
    b.vx = ow.vx; b.vy = ow.vy;
    b.rot += Math.hypot(ow.vx, ow.vy) * dt / BR;
  } else {
    b.x += b.vx * dt; b.y += b.vy * dt;
    const f = Math.exp(-DRAG * dt); b.vx *= f; b.vy *= f;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp < 3) { b.vx = b.vy = 0; }
    b.rot += sp * dt / BR;
  }
  if (b.y < BR) { b.y = BR; b.vy = Math.abs(b.vy) * .7; }
  if (b.y > H - BR) { b.y = H - BR; b.vy = -Math.abs(b.vy) * .7; }
  const inMouth = Math.abs(b.y - H / 2) < GH / 2 - 2;
  const playing = m.phase === 'play';
  if (b.x < BR) {
    if (inMouth) {
      if (playing && b.x < -BR) { scoreGoal(m, 1); return; }
      if (!playing) { if (b.x < -GOALD) { b.x = -GOALD; b.vx = Math.abs(b.vx) * .2; } b.y = clamp(b.y, H / 2 - GH / 2 + BR, H / 2 + GH / 2 - BR); }
    } else { b.x = BR; b.vx = Math.abs(b.vx) * .7; missShot(m, 1); }
  } else if (b.x > W - BR) {
    if (inMouth) {
      if (playing && b.x > W + BR) { scoreGoal(m, 0); return; }
      if (!playing) { if (b.x > W + GOALD) { b.x = W + GOALD; b.vx = -Math.abs(b.vx) * .2; } b.y = clamp(b.y, H / 2 - GH / 2 + BR, H / 2 + GH / 2 - BR); }
    } else { b.x = W - BR; b.vx = -Math.abs(b.vx) * .7; missShot(m, 0); }
  }
  for (const p of m.players) {
    if (m.owner) break;
    const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy), min = p.r + BR;
    if (d < min && d > .001) {
      const nx = dx / d, ny = dy / d;
      b.x = p.x + nx * min; b.y = p.y + ny * min;
      const vn = (b.vx - p.vx) * nx + (b.vy - p.vy) * ny;
      if (vn < 0) { b.vx -= 1.35 * vn * nx; b.vy -= 1.35 * vn * ny; }
      b.vx += p.vx * .1; b.vy += p.vy * .1;
      if (p.cool <= 0) m.last = p;
      if (p.role === 'f' && p.cool <= 0 && !m.owner && Math.hypot(b.vx - p.vx, b.vy - p.vy) < 430) {
        m.owner = p; m.last = p; b.vx = p.vx; b.vy = p.vy;
      }
    }
  }
  if (m.owner && playing) {
    const o = m.owner;
    for (const q of m.players) {
      if (q.team === o.team || q.role !== 'f' || q.cool > 0) continue;
      if (Math.hypot(q.x - b.x, q.y - b.y) < q.r + BR + 4) {
        const rate = q === m.ctrl ? 1.8 : 1.4 * (q.team === 1 ? m.lvl.speed / 134 : 1);
        if (Math.random() < rate * dt) { o.cool = .5; m.owner = q; m.last = q; b.vx = q.vx; b.vy = q.vy; break; }
      }
    }
  }
}

function step(m, dt) {
  if (m.shotT > 0) m.shotT -= dt;
  if (m.phase === 'kickoff') {
    m.phaseT -= dt;
    if (m.phaseT <= 0) { m.phase = 'play'; sfx.whistle(); }
    return;
  }
  if (m.phase === 'goal') {
    m.phaseT -= dt; ballStep(m, dt);
    for (const p of m.players) accel(p, 0, 0, dt);
    if (m.phaseT <= 0) {
      if (m.time >= m.dur) { m.phase = 'end'; m.phaseT = 1.2; sfx.whistle(); }
      else { resetPos(m, 1 - m.goalBy); m.phase = 'kickoff'; m.phaseT = 1.8; m.kickLabel = 'Saque'; }
    }
    return;
  }
  if (m.phase === 'end') { m.phaseT -= dt; if (m.phaseT <= 0 && !m.done) { m.done = true; finishMatch(m); } return; }

  m.time += dt;
  readMove();
  pickCtrl(m, dt); pickChaser(m);
  for (const p of m.players) {
    p.cool -= dt; p.think -= dt;
    if (p.role === 'gk') aiGK(m, p, dt, m.lvl);
    else if (p === m.ctrl) humanMove(m, p, dt);
    else aiField(m, p, dt, m.lvl);
  }
  for (let i = 0; i < m.players.length; i++) {
    for (let j = i + 1; j < m.players.length; j++) {
      const a = m.players[i], c = m.players[j];
      const dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy), min = a.r + c.r;
      if (d < min && d > .001) {
        const push = (min - d) / 2, nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push; c.x += nx * push; c.y += ny * push;
      }
    }
  }
  ballStep(m, dt);
  if (m.phase === 'play' && m.time >= m.dur) { m.phase = 'end'; m.phaseT = 1.2; sfx.whistle(); }
}

/* ---------- dibujo ---------- */
function label(txt, x, y, size, fill) {
  ctx.font = `900 ${size}px "Big Shoulders Display",Impact,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size / 8; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(6,12,20,.85)';
  ctx.strokeText(txt, x, y); ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function drawPitch() {
  ctx.fillStyle = '#1b4f2e'; ctx.fillRect(-PADX, -PADY, CW, CH);
  const n = 10, sw = W / n;
  for (let i = 0; i < n; i++) { ctx.fillStyle = i % 2 ? '#296f40' : '#2e7d46'; ctx.fillRect(i * sw, 0, sw, H); }
  ctx.strokeStyle = 'rgba(240,237,227,.78)'; ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, W, H);
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 62, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(240,237,227,.78)'; ctx.beginPath(); ctx.arc(W / 2, H / 2, 3, 0, 7); ctx.fill();
  for (const s of [0, 1]) {
    const x0 = s ? W : 0, d = s ? -1 : 1;
    ctx.strokeRect(s ? W - 110 : 0, H / 2 - 120, 110, 240);
    ctx.strokeRect(s ? W - 40 : 0, H / 2 - 60, 40, 120);
    ctx.beginPath(); ctx.arc(x0 + d * 80, H / 2, 3, 0, 7); ctx.fill();
    // red de la portería
    const gx = s ? W : -GOALD;
    ctx.fillStyle = 'rgba(6,12,20,.28)'; ctx.fillRect(gx, H / 2 - GH / 2, GOALD, GH);
    ctx.save(); ctx.beginPath(); ctx.rect(gx, H / 2 - GH / 2, GOALD, GH); ctx.clip();
    ctx.strokeStyle = 'rgba(240,237,227,.28)'; ctx.lineWidth = 1;
    for (let i = 0; i <= GOALD; i += 6) { ctx.beginPath(); ctx.moveTo(gx + i, H / 2 - GH / 2); ctx.lineTo(gx + i, H / 2 + GH / 2); ctx.stroke(); }
    for (let j = 0; j <= GH; j += 8) { ctx.beginPath(); ctx.moveTo(gx, H / 2 - GH / 2 + j); ctx.lineTo(gx + GOALD, H / 2 - GH / 2 + j); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = 'rgba(240,237,227,.9)'; ctx.lineWidth = 2;
    ctx.strokeRect(gx, H / 2 - GH / 2, GOALD, GH);
    ctx.fillStyle = '#f0ede3';
    for (const yy of [H / 2 - GH / 2, H / 2 + GH / 2]) { ctx.beginPath(); ctx.arc(x0, yy, 4, 0, 7); ctx.fill(); }
    ctx.strokeStyle = 'rgba(240,237,227,.78)'; ctx.fillStyle = 'rgba(240,237,227,.78)';
  }
}
function drawPlayer(m, p, t) {
  const kit = m.teams[p.team];
  const isGK = p.role === 'gk';
  const fill = isGK ? '#111827' : kit.c1, ring = isGK ? kit.c1 : kit.c2;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(p.x + 2, p.y + 4, p.r, p.r * .8, 0, 0, 7); ctx.fill();
  if (p === m.ctrl && m.phase !== 'end') {
    ctx.strokeStyle = '#ffb627'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 5 + Math.sin(t * 8) * 1.2, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  ctx.strokeStyle = ring; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(p.x + p.fx * (p.r - 3), p.y + p.fy * (p.r - 3), 2.6, 0, 7); ctx.fill();
  ctx.font = '700 11px "Barlow Semi Condensed",system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = isGK ? '#f0ede3' : (lum(fill) > .6 ? '#10161f' : '#ffffff');
  ctx.fillText(p.num, p.x - p.fx * 1.5, p.y - p.fy * 1.5 + .5);
}
function drawBall(b) {
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(b.x + 2, b.y + 3, BR, BR * .8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fbfaf5'; ctx.beginPath(); ctx.arc(b.x, b.y, BR, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1a2230'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = '#1a2230';
  for (let i = 0; i < 3; i++) {
    const a = b.rot + i * 2.094;
    ctx.beginPath(); ctx.arc(b.x + Math.cos(a) * 3.4, b.y + Math.sin(a) * 3.4, 1.6, 0, 7); ctx.fill();
  }
}
function draw(m, t) {
  const k = canvas.width / CW;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.translate(PADX, PADY);
  drawPitch();
  const order = m.players.slice().sort((a, b) => a.y - b.y);
  for (const p of order) drawPlayer(m, p, t);
  drawBall(m.ball);
  const c = m.ctrl;
  if (c && m.phase !== 'end') {
    ctx.fillStyle = '#ffb627';
    const y = c.y - c.r - 14 + Math.sin(t * 6) * 2;
    ctx.beginPath(); ctx.moveTo(c.x - 6, y - 6); ctx.lineTo(c.x + 6, y - 6); ctx.lineTo(c.x, y + 2); ctx.closePath(); ctx.fill();
    if (m.charge > .02) {
      ctx.fillStyle = 'rgba(6,12,20,.7)'; ctx.fillRect(c.x - 16, y - 16, 32, 6);
      ctx.fillStyle = m.charge > .9 ? '#ff6b3d' : '#ffb627'; ctx.fillRect(c.x - 15, y - 15, 30 * m.charge, 4);
    }
  }
  ctx.fillStyle = 'rgba(6,12,20,.75)'; ctx.fillRect(0, H + 5, 120, 10);
  ctx.fillStyle = m.tired ? '#ff6b3d' : '#6fe39a'; ctx.fillRect(1, H + 6, 118 * clamp(m.stam, 0, 100) / 100, 8);
  ctx.font = '600 10px "Barlow Semi Condensed",system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f0ede3'; ctx.fillText('RESISTENCIA', 126, H + 10.5);
  if (m.phase === 'kickoff') {
    label(String(Math.max(1, Math.ceil(m.phaseT))), W / 2, H / 2 - 70, 84, '#ffb627');
    label(m.kickLabel.toUpperCase(), W / 2, H / 2 + 80, 30, '#f0ede3');
  } else if (m.phase === 'goal') {
    label('¡GOL!', W / 2, H / 2 - 16, 110, '#ffb627');
    label(m.teams[m.goalBy].name.toUpperCase(), W / 2, H / 2 + 56, 36, '#f0ede3');
    if (m.scorer) label(m.scorer.toUpperCase(), W / 2, H / 2 + 98, 28, '#ffb627');
  } else if (m.phase === 'end') {
    label('FINAL', W / 2, H / 2, 100, '#ffb627');
  }
}

/* ---------- HUD ---------- */
function setText(el, v) { if (el.textContent !== v) el.textContent = v; }
const hBar = $('#hBar');
function updateHud(m) {
  setText($('#hA'), String(m.score[0])); setText($('#hB'), String(m.score[1]));
  const min = Math.min(90, Math.floor(m.time / m.dur * 90));
  setText($('#hClk'), m.phase === 'end' || m.time >= m.dur ? 'FIN' : min + "'");
  hBar.style.width = (clamp(m.time / m.dur, 0, 1) * 100).toFixed(1) + '%';
}
function setHudTeams(m) {
  $('#hNameA').textContent = m.teams[0].name; $('#hNameB').textContent = m.teams[1].name;
  const a = $('#hDotA'), b = $('#hDotB');
  a.style.background = m.teams[0].c1; a.style.boxShadow = '0 0 0 2px ' + m.teams[0].c2; a.innerHTML = flagImg(m.teams[0]); a.classList.toggle('fl', !!m.teams[0].flag);
  b.style.background = m.teams[1].c1; b.style.boxShadow = '0 0 0 2px ' + m.teams[1].c2; b.innerHTML = flagImg(m.teams[1]); b.classList.toggle('fl', !!m.teams[1].flag);
  hudEl.style.setProperty('--ca', m.teams[0].c1); hudEl.style.setProperty('--cb', m.teams[1].c1);
}

/* ---------- bucle ---------- */
let lastTs = 0, acc = 0;
function fit() {
  const w = canvas.clientWidth; if (!w) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(w * dpr * CH / CW);
}
if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);
addEventListener('resize', fit);

function frame(ts) {
  requestAnimationFrame(frame);
  const m = G.match;
  const dtr = Math.min(.05, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts;
  if (!m) return;
  if (!m.paused) {
    acc += dtr;
    while (acc >= STEP && G.match === m) { step(m, STEP); acc -= STEP; }
  }
  if (G.match === m) { draw(m, ts / 1000); updateHud(m); }
}
requestAnimationFrame(frame);

function togglePause() {
  const m = G.match; if (!m || m.phase === 'end') return;
  m.paused = !m.paused; pauseBox.hidden = !m.paused;
  bPause.textContent = m.paused ? 'Seguir' : 'Pausa';
  if (m.paused) { held.clear(); joyEnd(); runUp(); inp.shootHeld = false; inp.shootRel = false; inp.passQ = false; m.charge = 0; }
  else { acc = 0; const b = $('#bResume'); if (b) b.blur(); }
}
bPause.addEventListener('click', togglePause);
$('#bResume').addEventListener('click', togglePause);
$('#bQuit').addEventListener('click', () => { G.match = null; held.clear(); goHome(); });

/* ---------- liga ---------- */
function buildLeague(teamId) {
  const me = TEAMS.find(t => t.id === teamId) || TEAMS[0];
  const teams = [me].concat(TEAMS.filter(t => t !== me));
  const arr = [0, 1, 2, 3, 4, 5], rounds = [];   /* el 5 es el descanso */
  for (let r = 0; r < 5; r++) {
    const pairs = [];
    for (let i = 0; i < 3; i++) pairs.push([arr[i], arr[5 - i]]);
    rounds.push(pairs);
    arr.splice(1, 0, arr.pop());
  }
  for (let i = rounds.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rounds[i], rounds[j]] = [rounds[j], rounds[i]]; }
  return { teams, strs: teams.map(t => teamInfo(t).str), rounds, round: 0, counted: false, hist: [],
    rows: teams.map(() => ({ p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 })) };
}
function record(L, a, b, ga, gb) {
  const A = L.rows[a], B = L.rows[b];
  A.p++; B.p++; A.gf += ga; A.ga += gb; B.gf += gb; B.ga += ga;
  if (ga > gb) { A.w++; B.l++; } else if (ga < gb) { B.w++; A.l++; } else { A.d++; B.d++; }
}
function pois(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L && k < 12); return k - 1; }
function simRound(L, r) {
  for (const [a, b] of L.rounds[r]) {
    if (a === 5 || b === 5 || a === 0 || b === 0) continue;
    const sa = L.strs[a], sb = L.strs[b];
    record(L, a, b, pois(1.35 * Math.pow(sa / sb, .5)), pois(1.35 * Math.pow(sb / sa, .5)));
  }
}
function oppOf(L, r) {
  const pr = L.rounds[r].find(p => p[0] === 0 || p[1] === 0), o = pr[0] === 0 ? pr[1] : pr[0];
  return o === 5 ? -1 : o;
}
function leagueDone(L) {
  if (L.round < 5 || L.counted) return;
  L.counted = true;
  PROFILE = recordLeague(standings(L).findIndex(x => x.i === 0) + 1); updId();
}
function standings(L) {
  return L.rows.map((x, i) => ({ i, p: x.p, w: x.w, d: x.d, l: x.l, gf: x.gf, ga: x.ga, gd: x.gf - x.ga, pts: x.w * 3 + x.d }))
    .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.i - b.i);
}

/* ---------- pantallas ---------- */
function scr(html, ctxText) {
  stageEl.hidden = true; hudEl.hidden = true; padEl.hidden = true; padHint.hidden = true; bPause.hidden = true; pauseBox.hidden = true;
  document.getElementById('keyHint').hidden = true;
  ctxEl.textContent = ctxText || 'Fútbol arcade';
  document.querySelector('.app').classList.remove('is-home');
  setVol(VOL.m);
  screenEl.hidden = false; screenEl.innerHTML = html;
}
const flagImg = t => t.flag ? `<img src="${t.flag}" alt="" onerror="this.remove()">` : '';
const badge = t => `<i class="dot" style="background:${t.c1};box-shadow:0 0 0 2px ${t.c2}">${flagImg(t)}</i>`.replace('class="dot"', t.flag ? 'class="dot fl"' : 'class="dot"');

function controlsHtml() {
  const mob = getDevice() === 'mobile';
  const keys = mob
    ? '<div>Palanca: mover</div><div>PASE: toca el botón</div><div>TIRO: toca para tirar, mantén para un tiro potente</div><div>CORRER: mantén el botón</div><div>Pausa: botón Pausa de arriba</div>'
    : '<div><kbd>←↑↓→</kbd> o <kbd>W A S D</kbd> mover</div><div><kbd>Espacio</kbd> o <kbd>Z</kbd> pase</div><div><kbd>P</kbd> tiro: mantén para un tiro potente</div><div><kbd>L</kbd> mantén para correr</div><div><kbd>Esc</kbd> pausa</div>';
  return `<details open><summary>Controles</summary><div class="keys">${keys}</div>
      <p style="margin-top:10px">Controlas al jugador más cercano al balón y la pelota se pega a tu jugador al tocarla. Dispositivo: ${mob ? 'celular' : 'PC'}. <a href="../home/#dispositivo">Cambiar</a></p></details>`;
}
function showMenu() {
  G.mode = 'menu'; G.career = false; const c = G.cfg;
  const cards = TEAMS.map(t => {
    const inf = teamInfo(t), n = t.roster.length;
    return `<label class="tcard"><input type="radio" name="team" value="${t.id}" ${t.id === G.teamId ? 'checked' : ''}>
      <span class="tc"><span class="tc-top"><i class="shirt${t.flag ? ' fl' : ''}" style="--c1:${t.c1};--c2:${t.c2}">${flagImg(t)}</i><span class="tc-r"><b>${Math.round(inf.rating)}</b><small>Valoración</small></span></span>
      <strong>${esc(t.name)}</strong>
      <small class="tc-k">${t.kind} · ${n} jugador${n === 1 ? '' : 'es'}</small>
      <span class="tc-p">${esc(inf.best.join(', '))}</span></span></label>`;
  }).join('');
  scr(`
  <section class="card">
    <p class="kicker">Liga de 5 equipos · 4 partidos de 2 minutos · una jornada de descanso</p>
    <h1>Elige tu equipo</h1>
    <div class="teams" role="radiogroup" aria-label="Equipos">${cards}</div>
    <div class="menurow">
      <fieldset><legend>Dificultad del rival</legend>
        <div class="row">${LEVELS.map((l, i) => `<label class="seg"><input type="radio" name="lvl" value="${i}" ${i === c.level ? 'checked' : ''}><span>${l.name}</span></label>`).join('')}</div>
      </fieldset>
      <div style="display:grid;gap:10px"><label class="lbl" for="qOpp">Rival del partido rápido</label><select id="qOpp"></select></div>
    </div>
    <div class="row">
      <button class="btn primary" type="button" data-act="league">Comenzar liga</button>
      <button class="btn" type="button" data-act="quick">Partido rápido</button>
      <a class="btn" href="carrerajugador/">Carrera jugador</a>
      <a class="btn" href="../home/game/#ajustes">Ajustes</a>
      <button class="btn" type="button" data-act="home">Inicio</button>
    </div>
    ${controlsHtml()}
  </section>`, 'Fútbol arcade');
  fillRivals();
}
function fillRivals() {
  const sel = document.getElementById('qOpp'); if (!sel) return;
  const cur = sel.value, others = TEAMS.filter(t => t.id !== G.teamId);
  sel.innerHTML = '<option value="rnd">Aleatorio</option>' + others.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  if (others.some(t => t.id === cur)) sel.value = cur;
}
function readSetup() {
  const t = (document.querySelector('input[name=team]:checked') || {}).value;
  if (TEAMS.some(x => x.id === t)) G.teamId = t;
  const lvEl = document.querySelector('input[name=lvl]:checked');
  const lv = lvEl ? Number(lvEl.value) : G.cfg.level;
  G.cfg = Object.assign({}, G.cfg, { level: [0, 1, 2].includes(lv) ? lv : 1 });
  saveCfg(); saveTeam();
}

function fixtureHtml(L, r) {
  return L.rounds.map((_, i) => {
    const oi = oppOf(L, i), h = L.hist[i];
    let res;
    if (h && h.bye) res = '<b class="res-d">Descanso</b>';
    else if (h) res = `<b class="${h.gf > h.ga ? 'res-w' : h.gf < h.ga ? 'res-l' : 'res-d'}">${h.gf} - ${h.ga}</b>`;
    else res = `<b class="res-d">${i === r ? 'Hoy' : '·'}</b>`;
    const who = oi < 0 ? 'Descansas' : badge(L.teams[oi]) + esc(L.teams[oi].name);
    return `<li class="${i === r ? 'now' : ''}"><span class="fxn">Jornada ${i + 1} · ${who}</span>${res}</li>`;
  }).join('');
}
function showIntro() {
  const L = G.league, r = L.round, oi = oppOf(L, r), u = L.teams[0];
  if (oi < 0) {
    scr(`
    <section class="card">
      <p class="kicker">Jornada ${r + 1} de 5</p>
      <h1>Descansas esta jornada</h1>
      <p>Tu equipo no juega. Los otros cuatro equipos se enfrentan entre ellos.</p>
      <ul class="fx">${fixtureHtml(L, r)}</ul>
      <div class="row">
        <button class="btn primary" type="button" data-act="bye">Simular jornada</button>
        <button class="btn" type="button" data-act="table">Ver tabla</button>
        <button class="btn" type="button" data-act="home">Inicio</button>
      </div>
    </section>`, 'Liga · Descanso');
    return;
  }
  const o = L.teams[oi], ok = kitFor(o, u.c1), ru = Math.round(teamInfo(u).rating), ro = Math.round(teamInfo(o).rating);
  scr(`
  <section class="card">
    <p class="kicker">Jornada ${r + 1} de 5</p>
    <div class="vs">${badge(u)}<span>${esc(u.name)}</span><em>vs</em>${badge({ c1: ok.c1, c2: ok.c2, flag: o.flag })}<span>${esc(o.name)}</span></div>
    <p>Valoración ${ru} contra ${ro}. Dificultad ${LEVELS[G.cfg.level].name.toLowerCase()}.</p>
    <ul class="fx">${fixtureHtml(L, r)}</ul>
    <div class="row">
      <button class="btn primary" type="button" data-act="play">Jugar</button>
      <button class="btn" type="button" data-act="table">Ver tabla</button>
      <button class="btn" type="button" data-act="home">Inicio</button>
    </div>
  </section>`, 'Liga · Jornada ' + (r + 1) + '/5');
}
function tableHtml(L) {
  const rows = standings(L).map((s, pos) => {
    const t = L.teams[s.i];
    return `<tr class="${s.i === 0 ? 'me' : ''}"><td>${pos + 1}</td><td>${badge(t)}${esc(t.name)}</td><td>${s.p}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${s.gf}:${s.ga}</td><td>${s.gd > 0 ? '+' : ''}${s.gd}</td><td>${s.pts}</td></tr>`;
  }).join('');
  return `<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>Goles</th><th>DG</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function showTable(afterMatch) {
  const L = G.league, done = L.round >= 5;
  let banner = '', btns;
  if (done) {
    const pos = standings(L).findIndex(s => s.i === 0) + 1;
    banner = `<div class="banner">${pos === 1 ? '¡Campeón de la liga!' : pos === 2 ? 'Subcampeón' : 'Terminaste en el puesto ' + pos}</div>`;
    btns = `<button class="btn primary" type="button" data-act="league">Nueva liga</button><button class="btn" type="button" data-act="menu">Cambiar de equipo</button><button class="btn" type="button" data-act="home">Inicio</button>`;
  } else {
    btns = `<button class="btn primary" type="button" data-act="intro">${afterMatch ? 'Siguiente jornada' : 'Volver'}</button><button class="btn" type="button" data-act="home">Inicio</button>`;
  }
  scr(`<section class="card"><p class="kicker">${done ? 'Final de la liga' : 'Tabla tras ' + L.round + ' jornada' + (L.round === 1 ? '' : 's')}</p>${banner}${tableHtml(L)}<div class="row">${btns}</div></section>`, 'Liga · Tabla');
}
function showFull(m, quick) {
  const gf = m.score[0], ga = m.score[1];
  const msg = gf > ga ? 'Victoria' : gf < ga ? 'Derrota' : 'Empate';
  const btns = quick
    ? `<button class="btn primary" type="button" data-act="quick">Revancha</button><button class="btn" type="button" data-act="menu">Cambiar de equipo</button><button class="btn" type="button" data-act="home">Inicio</button>`
    : `<button class="btn primary" type="button" data-act="table2">Ver tabla</button>`;
  const goals = m.goals.length
    ? `<ul class="goals">${m.goals.map(g => `<li><span class="gm">${g.min}'</span>${badge(m.teams[g.team])}<span>${esc(g.who)}</span></li>`).join('')}</ul>`
    : '<p>No hubo goles.</p>';
  scr(`<section class="card">
    <p class="kicker">Final del partido</p>
    <div class="vs">${badge(m.teams[0])}<span>${esc(m.teams[0].name)}</span><em>vs</em>${badge(m.teams[1])}<span>${esc(m.teams[1].name)}</span></div>
    <div class="big">${gf} - ${ga}</div>
    <h2 class="${gf > ga ? 'res-w' : gf < ga ? 'res-l' : 'res-d'}">${msg}</h2>
    <div style="display:grid;gap:10px"><h3 class="lbl">Goles</h3>${goals}</div>
    <div class="row">${btns}</div>
  </section>`, quick ? 'Partido rápido' : 'Liga · Final');
}

screenEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  audio();
  const a = b.dataset.act;
  tone(660, .06, 'square', .03);
  if (a === 'menu' || a === 'jugar') showMenu();
  else if (a === 'home') goHome();
  else if (a === 'league') { readSetup(); G.league = buildLeague(G.teamId); G.mode = 'league'; showIntro(); }
  else if (a === 'quick') {
    if (G.mode === 'menu') {
      readSetup();
      const v = (document.getElementById('qOpp') || {}).value, others = TEAMS.filter(t => t.id !== G.teamId);
      G.quickRival = (others.find(t => t.id === v) || others[Math.floor(Math.random() * others.length)]).id;
    }
    G.mode = 'quick';
    startMatch(TEAMS.find(t => t.id === G.quickRival) || TEAMS.find(t => t.id !== G.teamId));
  }
  else if (a === 'intro') showIntro();
  else if (a === 'play') startMatch(G.league.teams[oppOf(G.league, G.league.round)]);
  else if (a === 'bye') {
    const L = G.league;
    simRound(L, L.round); L.hist.push({ bye: true }); L.round++; leagueDone(L);
    if (L.round >= 5) showTable(true); else showIntro();
  }
  else if (a === 'table') showTable(false);
  else if (a === 'table2') showTable(true);
});
screenEl.addEventListener('change', e => {
  const t = e.target;
  if (t && t.name === 'team') { G.teamId = t.value; saveTeam(); fillRivals(); }
});

function startMatch(oppTeam) {
  const me = TEAMS.find(t => t.id === G.teamId) || TEAMS[0];
  const m = newMatch(me, oppTeam, G.cfg.level);
  G.match = m; held.clear(); joyEnd(); inp.shootHeld = inp.shootRel = inp.passQ = false;
  screenEl.hidden = true; screenEl.innerHTML = '';
  stageEl.hidden = false; hudEl.hidden = false; bPause.hidden = false; bPause.textContent = 'Pausa'; pauseBox.hidden = true;
  const touch = getDevice() === 'mobile';
  padEl.hidden = !touch; padHint.hidden = !touch;
  document.getElementById('keyHint').hidden = touch;
  ctxEl.textContent = G.mode === 'league' ? 'Liga · Jornada ' + (G.league.round + 1) + '/5' : 'Partido rápido';
  stopMusic(); setHudTeams(m); fit(); acc = 0; lastTs = performance.now();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  updateHud(m); draw(m, 0);
}
function finishMatch(m) {
  G.match = null; held.clear(); joyEnd(); playMusic();
  PROFILE = recordMatch(m.score[0], m.score[1]); updId();
  if (G.mode === 'league') {
    const L = G.league, r = L.round, oi = oppOf(L, r);
    record(L, 0, oi, m.score[0], m.score[1]);
    L.hist.push({ gf: m.score[0], ga: m.score[1] });
    simRound(L, r); L.round++;
    leagueDone(L);
    showFull(m, false);
  } else showFull(m, true);
}


showMenu();
})();
</script>
